<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>FBX Skeleton Viewer</title>
  <style>
    body {margin:0; overflow:hidden;}
    #dropOverlay {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      z-index: 1000;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 28px;
      font-weight: bold;
      background: rgba(30, 120, 180, 0.35);
      border: 4px dashed rgba(255, 255, 255, 0.85);
      box-sizing: border-box;
      pointer-events: none;
    }
    body.dragging #dropOverlay { display: grid; }
  </style>
</head>
<body>
<div id="loading" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: Arial, sans-serif; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px;">
  FBXファイルを読み込み中...
</div>
<div id="info" style="position: absolute; top: 10px; left: 10px; color: white; font-family: monospace; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; font-size: 12px; max-width: 300px;">
  初期化中...
</div>

<!-- ファイルインポートUI -->
<div id="fileImport" style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; color: white; font-family: Arial, sans-serif;">
  <div style="margin-bottom: 10px; font-size: 14px; font-weight: bold;">FBXファイル読み込み</div>
  <input type="file" id="fbxFileInput" accept=".fbx" style="margin-bottom: 10px; color: white; background: rgba(255,255,255,0.1); border: 1px solid #555; border-radius: 3px; padding: 5px;">

  <!-- 座標系変換チェックボックス -->
  <div style="display: flex; align-items: center; gap: 8px;">
    <input type="checkbox" id="convertToYUp" checked style="margin: 0;">
    <label for="convertToYUp" style="font-size: 12px; cursor: pointer;">Z-up → Y-up 変換</label>
  </div>
</div>

<!-- アニメーション制御UI -->
<div id="dropOverlay">Drop FBX file to load</div>

<div id="controls" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; color: white; font-family: Arial, sans-serif; display: none; width: 700px;">
  <div style="margin-bottom: 10px; text-align: center;">
    <button id="prevFrameBtn" title="Previous frame" style="margin: 0 5px; padding: 8px 12px; background: #607d8b; color: white; border: none; border-radius: 5px; cursor: pointer;">-1 frame</button>
    <button id="playPauseBtn" style="margin: 0 5px; padding: 8px 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; min-width: 80px;">▶ 再生</button>
    <button id="resetBtn" style="margin: 0 5px; padding: 8px 15px; background: #f44336; color: white; border: none; border-radius: 5px; cursor: pointer;">⏮ リセット</button>
    <button id="nextFrameBtn" title="Next frame" style="margin: 0 5px; padding: 8px 12px; background: #607d8b; color: white; border: none; border-radius: 5px; cursor: pointer;">+1 frame</button>
  </div>
  <div style="display: flex; align-items: center; gap: 15px; justify-content: center;">
    <span style="font-size: 12px; min-width: 45px;">Frame:</span>
    <input type="range" id="timeSlider" min="0" max="100" step="1" value="0" style="width: 430px;">
    <span id="timeDisplay" style="font-size: 12px; min-width: 130px;">0 / 0</span>
  </div>
  <div style="margin-top: 8px; display: flex; align-items: center; gap: 15px; justify-content: center;">
    <span style="font-size: 12px; min-width: 35px;">速度:</span>
    <input type="range" id="speedSlider" min="0.1" max="3" step="0.1" value="1" style="width: 400px;">
    <span id="speedDisplay" style="font-size: 12px; min-width: 35px;">1.0x</span>
  </div>
  <div id="ghostControls" style="margin-top: 8px; display: none; align-items: center; gap: 10px; justify-content: center;">
    <button id="ghostToggleBtn" style="padding: 7px 14px; background: #455a64; color: white; border: none; border-radius: 5px; cursor: pointer;">Ghost Off</button>
    <label style="font-size: 12px;">Back
      <input type="number" id="ghostSecondsInput" min="0.1" max="10" step="0.1" value="1" style="width: 55px; margin-left: 4px;">
      sec
    </label>
    <label style="font-size: 12px;">Count
      <input type="number" id="ghostCountInput" min="1" max="50" step="1" value="10" style="width: 45px; margin-left: 4px;">
    </label>
    <span id="ghostStatus" style="font-size: 12px; min-width: 90px;">cached: 0</span>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

const infoDiv = document.getElementById('info');
const loadingDiv = document.getElementById('loading');

function updateInfo(message) {
  console.log(message);
  infoDiv.innerHTML = message;
}

function hideLoading() {
  loadingDiv.style.display = 'none';
}

function showError(message) {
  hideLoading();
  const errorDiv = document.createElement('div');
  errorDiv.style.position = 'absolute';
  errorDiv.style.top = '50%';
  errorDiv.style.left = '50%';
  errorDiv.style.transform = 'translate(-50%, -50%)';
  errorDiv.style.color = 'red';
  errorDiv.style.backgroundColor = 'rgba(0,0,0,0.9)';
  errorDiv.style.padding = '20px';
  errorDiv.style.fontFamily = 'monospace';
  errorDiv.style.borderRadius = '10px';
  errorDiv.style.maxWidth = '80%';
  errorDiv.innerHTML = `<strong>エラー:</strong> ${message}`;
  document.body.appendChild(errorDiv);
}

try {
  updateInfo("Three.js初期化中...");

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x202020);
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 1, 10000);
  camera.position.set(300, 200, 500);

  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  updateInfo("レンダラー初期化完了");

  const controls = new OrbitControls(camera, renderer.domElement);
  
  // Mayaスタイルのマウス操作設定
  // 左クリック: 回転、中クリック: パン（移動）、右クリック: ズーム
  controls.mouseButtons = {
    LEFT: THREE.MOUSE.ROTATE,
    MIDDLE: THREE.MOUSE.PAN,   // 中クリック: パン（移動）
    RIGHT: THREE.MOUSE.DOLLY   // 右クリック: ズーム
  };
  
  // スムーズな操作のための設定
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.screenSpacePanning = false;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 1.2));

  // 地面のグリッドを追加（1000m x 1000m、100分割で10m間隔）
  const gridHelper = new THREE.GridHelper(1000, 100, 0x888888, 0x444444);
  scene.add(gridHelper);

  // テスト用キューブを追加
  const testGeometry = new THREE.BoxGeometry(1, 1, 1);
  const testMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true });
  const testCube = new THREE.Mesh(testGeometry, testMaterial);
  scene.add(testCube);

  updateInfo("基本シーン設定完了、FBXファイル読み込み開始...");

  let mixer;
  let currentFBXObject = null;
  let currentAction = null;
  let currentObjectUrl = null;
  const loader = new FBXLoader();
  let animationBones = [];
  let animationBoneLinks = [];
  let frameCache = new Map();
  let cachedFrameNumbers = [];
  let ghostEnabled = false;
  let ghostGroup = new THREE.Group();
  let lastGhostRenderKey = '';
  let activeAnimationState = null;
  scene.add(ghostGroup);

  // FBX読み込み関数
  function loadFBXFile(fileUrl, fileName = null) {
    loadingDiv.style.display = 'block';
    loadingDiv.textContent = 'Loading FBX file...';
    // 既存のオブジェクトとアニメーションをクリア
    if (currentFBXObject) {
      scene.remove(currentFBXObject);
      currentFBXObject = null;
    }
    
    // 既存のスケルトンヘルパーとAxesHelperを削除
    const objectsToRemove = [];
    scene.traverse((obj) => {
      if (obj.type === 'SkeletonHelper' || obj.type === 'AxesHelper') {
        objectsToRemove.push(obj);
      }
    });
    objectsToRemove.forEach(obj => scene.remove(obj));
    
    if (mixer) {
      mixer.stopAllAction();
      mixer = null;
    }
    if (currentAction) {
      currentAction = null;
    }

    // UIを非表示にする
    document.getElementById('controls').style.display = 'none';
    resetGhostState();
    
    updateInfo(`FBX読み込み中... ${fileName || fileUrl}`);
    console.log("FBXファイルの読み込みを開始:", fileName || fileUrl);

    loader.load(
      fileUrl,
    (root) => {
      hideLoading();
      console.log("FBXファイルの読み込み完了:", root);
      console.log("アニメーション数:", root.animations ? root.animations.length : 0);
      
      updateInfo(`FBX読み込み完了<br>アニメーション: ${root.animations ? root.animations.length : 0}個`);

      // 座標系変換（チェックボックスの状態に応じて）
      const convertToYUp = document.getElementById('convertToYUp').checked;
      const coordinateSystem = convertToYUp ? 'Y-up (変換適用)' : 'Z-up (元の座標系)';
      
      if (convertToYUp) {
        // Y-up座標系に変換（FBXはZ-upが多いため）
        // X軸を-90度回転してZ-upからY-upに変換
        root.rotation.x = -Math.PI / 2;
        console.log("Z-up → Y-up変換を適用");
      } else {
        // 元の座標系を維持（Z-up）
        root.rotation.x = 0;
        console.log("元の座標系（Z-up）を維持");
      }
      
      // シーンへ追加
      scene.add(root);
      currentFBXObject = root;
      collectAnimationBones(root);

      // テストキューブを削除
      scene.remove(testCube);

      // — SkeletonHelper で骨を線表示 —
      let skeletonFound = false;
      let boneCount = 0;
      
      root.traverse((obj) => {
        console.log("オブジェクト:", obj.name, "タイプ:", obj.type, "isBone:", obj.isBone);
        
        if (obj.isBone) {
          boneCount++;
        }
        
        // SkinnedMeshがある場合はそのスケルトンを使用
        if (obj.isSkinnedMesh && obj.skeleton) {
          console.log("SkinnedMeshのスケルトンを発見:", obj.name);
          const helper = new THREE.SkeletonHelper(obj);
          helper.material.linewidth = 2;
          scene.add(helper);
          skeletonFound = true;
        }
        // SkinnedMeshがない場合は、ボーン階層のルートを探す
        else if (obj.isBone && (!obj.parent || !obj.parent.isBone)) {
          console.log("ルートボーンを発見:", obj.name);
          const helper = new THREE.SkeletonHelper(obj);
          helper.material.linewidth = 2;
          scene.add(helper);
          skeletonFound = true;
        }
      });

      if (!skeletonFound && boneCount > 0) {
        console.warn("スケルトンヘルパーが作成できませんでした。AxesHelperを代替使用します。");
        // 代替案：すべてのボーンにAxesHelperを追加
        root.traverse((obj) => {
          if (obj.isBone) {
            const axesHelper = new THREE.AxesHelper(0.5);
            obj.add(axesHelper);
            console.log("ボーンにAxesHelperを追加:", obj.name);
          }
        });
        updateInfo(`FBX読み込み完了<br>座標系: ${coordinateSystem}<br>ボーン: ${boneCount}個（AxesHelper表示）<br>アニメーション: ${root.animations ? root.animations.length : 0}個`);
      } else if (skeletonFound) {
        updateInfo(`FBX読み込み完了<br>座標系: ${coordinateSystem}<br>スケルトン表示中<br>ボーン: ${boneCount}個<br>アニメーション: ${root.animations ? root.animations.length : 0}個`);
      } else {
        updateInfo(`FBX読み込み完了<br>座標系: ${coordinateSystem}<br>ボーンが見つかりません<br>オブジェクト構造をコンソールで確認してください`);
      }

      // — アニメーション再生 —
      let animationDuration = 0;
      
      if (root.animations && root.animations.length > 0) {
        console.log("アニメーションを開始:", root.animations[0].name);
        mixer = new THREE.AnimationMixer(root);
        currentAction = mixer.clipAction(root.animations[0]);
        animationDuration = root.animations[0].duration;
        currentAction.play();
        
        // UI制御を表示
        document.getElementById('controls').style.display = 'block';
        
        // アニメーション制御の設定
        setupAnimationControls(currentAction, animationDuration);
      } else {
        console.warn("アニメーションが見つかりませんでした。");
      }

      // カメラ位置の調整（オブジェクトのサイズに基づく）
      const box = new THREE.Box3().setFromObject(root);
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      if (maxDim > 0) {
        camera.position.set(maxDim * 1.5, maxDim * 1.5, maxDim * 1.5);
        camera.lookAt(box.getCenter(new THREE.Vector3()));
        // カメラコントロールをリセット
        controls.reset();
      }
      
      console.log("オブジェクトサイズ:", size);
      console.log("カメラ位置を調整:", camera.position);
    },
    (progress) => {
      if (progress.total > 0) {
        const percent = Math.round((progress.loaded / progress.total) * 100);
        updateInfo(`FBX読み込み中... ${percent}%`);
        console.log("読み込み進行:", percent + '%');
      }
    },
    (error) => {
      console.error("FBXファイルの読み込みエラー:", error);
      showError(`FBXファイルが読み込めません<br>ファイル: ${fileName || fileUrl}<br>詳細: ${error.message || error}`);
    }
  );
  }

  // デフォルトファイルを読み込み
  loadFBXFile("./your_skeleton.fbx");

  // ファイル選択機能の設定（選択時に自動読み込み）
  const fbxFileInput = document.getElementById('fbxFileInput');

  function loadLocalFBXFile(file) {
    if (!file || !file.name.toLowerCase().endsWith('.fbx')) {
      updateInfo('Please drop or select an FBX file.');
      return;
    }

    if (currentObjectUrl) {
      URL.revokeObjectURL(currentObjectUrl);
      currentObjectUrl = null;
    }

    currentObjectUrl = URL.createObjectURL(file);
    loadFBXFile(currentObjectUrl, file.name);
  }

  fbxFileInput.addEventListener('change', (event) => {
    const file = event.target.files[0];
    loadLocalFBXFile(file);
  });

  let dragDepth = 0;

  window.addEventListener('dragenter', (event) => {
    event.preventDefault();
    dragDepth++;
    document.body.classList.add('dragging');
  });

  window.addEventListener('dragover', (event) => {
    event.preventDefault();
  });

  window.addEventListener('dragleave', (event) => {
    event.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) {
      document.body.classList.remove('dragging');
    }
  });

  window.addEventListener('drop', (event) => {
    event.preventDefault();
    dragDepth = 0;
    document.body.classList.remove('dragging');

    const file = Array.from(event.dataTransfer.files).find((item) =>
      item.name.toLowerCase().endsWith('.fbx')
    );
    loadLocalFBXFile(file);
  });

  // 座標系変換チェックボックスのイベントリスナー
  const convertToYUpCheckbox = document.getElementById('convertToYUp');
  convertToYUpCheckbox.addEventListener('change', () => {
    // 既に読み込まれているFBXオブジェクトがある場合、リアルタイムで座標系を変更
    if (currentFBXObject) {
      resetGhostCache();
      const convertToYUp = convertToYUpCheckbox.checked;
      if (convertToYUp) {
        // Y-up座標系に変換
        currentFBXObject.rotation.x = -Math.PI / 2;
        console.log("座標系をY-upに変更");
        updateInfo(`座標系: Y-up (変換適用)<br>ボーン表示中<br>アニメーション: ${currentFBXObject.animations ? currentFBXObject.animations.length : 0}個`);
      } else {
        // 元の座標系を維持（Z-up）
        currentFBXObject.rotation.x = 0;
        console.log("座標系をZ-upに変更");
        updateInfo(`座標系: Z-up (元の座標系)<br>ボーン表示中<br>アニメーション: ${currentFBXObject.animations ? currentFBXObject.animations.length : 0}個`);
      }
    }
  });

  // アニメーション制御関数
  function setupAnimationControls(action, duration) {
    const playPauseBtn = document.getElementById('playPauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const timeSlider = document.getElementById('timeSlider');
    const timeDisplay = document.getElementById('timeDisplay');
    const speedSlider = document.getElementById('speedSlider');
    const speedDisplay = document.getElementById('speedDisplay');
    
    let isPlaying = true;
    
    // 再生/一時停止ボタン（統合）
    playPauseBtn.addEventListener('click', () => {
      if (isPlaying) {
        // 一時停止
        action.paused = true;
        isPlaying = false;
        playPauseBtn.innerHTML = '▶ 再生';
        playPauseBtn.style.background = '#4CAF50';
      } else {
        // 再生
        action.paused = false;
        if (!action.isRunning()) {
          action.play();
        }
        isPlaying = true;
        playPauseBtn.innerHTML = '⏸ 停止';
        playPauseBtn.style.background = '#ff9800';
      }
    });
    
    // 初期状態を再生中に設定
    playPauseBtn.innerHTML = '⏸ 停止';
    playPauseBtn.style.background = '#ff9800';
    
    // リセットボタン
    resetBtn.addEventListener('click', () => {
      action.reset();
      action.play();
      isPlaying = true;
      playPauseBtn.innerHTML = '⏸ 停止';
      playPauseBtn.style.background = '#ff9800';
    });
    
    // タイムスライダー
    timeSlider.max = duration;
    timeSlider.addEventListener('input', () => {
      const time = parseFloat(timeSlider.value);
      action.time = time;
      if (!isPlaying) {
        mixer.update(0); // 一時停止中でも位置を更新
      }
    });
    
    // 速度スライダー
    speedSlider.addEventListener('input', () => {
      const speed = parseFloat(speedSlider.value);
      action.setEffectiveTimeScale(speed);
      speedDisplay.textContent = speed.toFixed(1) + 'x';
    });
    
    // 時間表示の更新関数
    window.updateTimeDisplay = () => {
      if (action) {
        const currentTime = action.time;
        timeSlider.value = currentTime;
        timeDisplay.textContent = `${currentTime.toFixed(1)} / ${duration.toFixed(1)}s`;
      }
    };
  }

  function inferFrameRate(clip) {
    if (!clip || !clip.tracks || clip.tracks.length === 0) {
      return 30;
    }

    const deltas = [];
    for (const track of clip.tracks) {
      const times = track.times;
      for (let i = 1; i < times.length; i++) {
        const delta = times[i] - times[i - 1];
        if (delta > 0.0001 && delta < 1) {
          deltas.push(delta);
        }
      }
    }

    if (deltas.length === 0) {
      return 30;
    }

    deltas.sort((a, b) => a - b);
    const medianDelta = deltas[Math.floor(deltas.length / 2)];
    const inferred = Math.round(1 / medianDelta);
    const commonRates = [24, 25, 30, 48, 50, 60, 120];
    const commonRate = commonRates.find((rate) => Math.abs(rate - (1 / medianDelta)) < 0.25);
    return Math.min(240, Math.max(1, commonRate || inferred || 30));
  }

  function clearGhostLines() {
    while (ghostGroup.children.length > 0) {
      const child = ghostGroup.children.pop();
      if (child.geometry) {
        child.geometry.dispose();
      }
      if (child.material) {
        child.material.dispose();
      }
    }
  }

  function resetGhostState() {
    animationBones = [];
    animationBoneLinks = [];
    frameCache = new Map();
    cachedFrameNumbers = [];
    ghostEnabled = false;
    lastGhostRenderKey = '';
    activeAnimationState = null;
    clearGhostLines();

    const ghostControls = document.getElementById('ghostControls');
    const ghostToggleBtn = document.getElementById('ghostToggleBtn');
    const ghostStatus = document.getElementById('ghostStatus');
    if (ghostControls) {
      ghostControls.style.display = 'none';
    }
    if (ghostToggleBtn) {
      ghostToggleBtn.textContent = 'Ghost Off';
      ghostToggleBtn.style.background = '#455a64';
    }
    if (ghostStatus) {
      ghostStatus.textContent = 'cached: 0';
    }
  }

  function resetGhostCache() {
    frameCache = new Map();
    cachedFrameNumbers = [];
    ghostEnabled = false;
    lastGhostRenderKey = '';
    clearGhostLines();

    const ghostControls = document.getElementById('ghostControls');
    const ghostToggleBtn = document.getElementById('ghostToggleBtn');
    const ghostStatus = document.getElementById('ghostStatus');
    if (ghostControls) {
      ghostControls.style.display = 'none';
    }
    if (ghostToggleBtn) {
      ghostToggleBtn.textContent = 'Ghost Off';
      ghostToggleBtn.style.background = '#455a64';
    }
    if (ghostStatus) {
      ghostStatus.textContent = 'cached: 0';
    }
  }

  function collectAnimationBones(root) {
    animationBones = [];
    animationBoneLinks = [];

    root.traverse((obj) => {
      if (obj.isBone) {
        animationBones.push(obj);
      }
    });

    const boneIndex = new Map(animationBones.map((bone, index) => [bone, index]));
    for (const bone of animationBones) {
      if (bone.parent && bone.parent.isBone && boneIndex.has(bone.parent)) {
        animationBoneLinks.push([boneIndex.get(bone.parent), boneIndex.get(bone)]);
      }
    }
  }

  function updateGhostControlsVisibility() {
    const ghostControls = document.getElementById('ghostControls');
    const ghostStatus = document.getElementById('ghostStatus');
    if (ghostControls && frameCache.size > 0) {
      ghostControls.style.display = 'flex';
    }
    if (ghostStatus) {
      ghostStatus.textContent = `cached: ${frameCache.size}`;
    }
  }

  function cacheCurrentPose(frame) {
    if (!currentFBXObject || animationBones.length === 0 || frameCache.has(frame)) {
      return;
    }

    currentFBXObject.updateMatrixWorld(true);
    const positions = new Float32Array(animationBones.length * 3);
    const position = new THREE.Vector3();

    for (let i = 0; i < animationBones.length; i++) {
      animationBones[i].getWorldPosition(position);
      positions[i * 3] = position.x;
      positions[i * 3 + 1] = position.y;
      positions[i * 3 + 2] = position.z;
    }

    frameCache.set(frame, positions);
    cachedFrameNumbers.push(frame);
    cachedFrameNumbers.sort((a, b) => a - b);
    updateGhostControlsVisibility();
  }

  function getClosestCachedFrame(targetFrame, minFrame) {
    let closestFrame = null;
    let closestDistance = Infinity;

    for (const frame of cachedFrameNumbers) {
      if (frame < minFrame || frame > targetFrame) {
        continue;
      }

      const distance = targetFrame - frame;
      if (distance < closestDistance) {
        closestDistance = distance;
        closestFrame = frame;
      }
    }

    return closestFrame;
  }

  function renderGhosts(currentFrame) {
    if (!ghostEnabled || !activeAnimationState || animationBoneLinks.length === 0 || frameCache.size === 0) {
      if (ghostGroup.children.length > 0) {
        clearGhostLines();
      }
      lastGhostRenderKey = '';
      return;
    }

    const secondsInput = document.getElementById('ghostSecondsInput');
    const countInput = document.getElementById('ghostCountInput');
    const secondsBack = Math.min(10, Math.max(0.1, parseFloat(secondsInput.value) || 1));
    const ghostCount = Math.min(50, Math.max(1, parseInt(countInput.value, 10) || 10));
    const renderKey = `${currentFrame}|${secondsBack}|${ghostCount}|${frameCache.size}`;
    if (renderKey === lastGhostRenderKey) {
      return;
    }
    lastGhostRenderKey = renderKey;
    clearGhostLines();

    const frameBack = Math.max(1, Math.round(secondsBack * activeAnimationState.frameRate));
    const minFrame = Math.max(0, currentFrame - frameBack);
    const usedFrames = new Set();

    for (let i = 1; i <= ghostCount; i++) {
      const targetFrame = currentFrame - Math.round((frameBack * i) / ghostCount);
      const cachedFrame = getClosestCachedFrame(targetFrame, minFrame);
      if (cachedFrame === null || usedFrames.has(cachedFrame)) {
        continue;
      }
      usedFrames.add(cachedFrame);

      const positions = frameCache.get(cachedFrame);
      const vertices = [];
      for (const [parentIndex, childIndex] of animationBoneLinks) {
        vertices.push(
          positions[parentIndex * 3],
          positions[parentIndex * 3 + 1],
          positions[parentIndex * 3 + 2],
          positions[childIndex * 3],
          positions[childIndex * 3 + 1],
          positions[childIndex * 3 + 2]
        );
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      const ageRatio = Math.min(1, Math.max(0, (currentFrame - cachedFrame) / frameBack));
      const material = new THREE.LineBasicMaterial({
        color: 0x66ccff,
        transparent: true,
        opacity: 0.45 * (1 - ageRatio) + 0.08,
        depthTest: true
      });
      ghostGroup.add(new THREE.LineSegments(geometry, material));
    }
  }

  function updateFrameCacheAndGhosts() {
    if (!activeAnimationState || !activeAnimationState.action) {
      return;
    }

    const frame = activeAnimationState.currentFrame();
    if (!activeAnimationState.isPlaying || activeAnimationState.isPlaying()) {
      cacheCurrentPose(frame);
    }
    renderGhosts(frame);
  }

  setupAnimationControls = function(action, duration) {
    const playPauseBtn = document.getElementById('playPauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const prevFrameBtn = document.getElementById('prevFrameBtn');
    const nextFrameBtn = document.getElementById('nextFrameBtn');
    const timeSlider = document.getElementById('timeSlider');
    const timeDisplay = document.getElementById('timeDisplay');
    const speedSlider = document.getElementById('speedSlider');
    const speedDisplay = document.getElementById('speedDisplay');
    const ghostToggleBtn = document.getElementById('ghostToggleBtn');
    const ghostSecondsInput = document.getElementById('ghostSecondsInput');
    const ghostCountInput = document.getElementById('ghostCountInput');
    const clip = action.getClip ? action.getClip() : null;
    const frameRate = inferFrameRate(clip);
    const totalFrames = Math.max(1, Math.round(duration * frameRate));

    let isPlaying = true;

    timeSlider.min = 0;
    timeSlider.max = totalFrames;
    timeSlider.step = 1;
    timeSlider.value = 0;

    function frameToTime(frame) {
      return Math.min(duration, Math.max(0, frame / frameRate));
    }

    function currentFrame() {
      return Math.min(totalFrames, Math.max(0, Math.round(action.time * frameRate)));
    }

    function setPlayButtonState() {
      if (isPlaying) {
        playPauseBtn.innerHTML = 'Pause';
        playPauseBtn.style.background = '#ff9800';
      } else {
        playPauseBtn.innerHTML = 'Play';
        playPauseBtn.style.background = '#4CAF50';
      }
    }

    function setPlaying(nextIsPlaying) {
      isPlaying = nextIsPlaying;
      action.paused = !isPlaying;
      if (isPlaying && !action.isRunning()) {
        action.play();
      }
      setPlayButtonState();
    }

    function setFrame(frame) {
      const nextFrame = Math.min(totalFrames, Math.max(0, Math.round(frame)));
      action.time = frameToTime(nextFrame);
      timeSlider.value = nextFrame;
      timeDisplay.textContent = `${nextFrame} / ${totalFrames} frames (${frameRate}fps)`;
      if (mixer) {
        mixer.update(0);
      }
      renderGhosts(nextFrame);
    }

    activeAnimationState = {
      action,
      duration,
      frameRate,
      totalFrames,
      currentFrame,
      isPlaying: () => isPlaying
    };

    setPlaying(true);
    setFrame(0);

    playPauseBtn.onclick = () => {
      setPlaying(!isPlaying);
    };

    resetBtn.onclick = () => {
      action.reset();
      action.play();
      setPlaying(true);
      setFrame(0);
    };

    prevFrameBtn.onclick = () => {
      setPlaying(false);
      setFrame(currentFrame() - 1);
    };

    nextFrameBtn.onclick = () => {
      setPlaying(false);
      setFrame(currentFrame() + 1);
    };

    timeSlider.oninput = () => {
      setFrame(parseInt(timeSlider.value, 10));
    };

    speedSlider.oninput = () => {
      const speed = parseFloat(speedSlider.value);
      action.setEffectiveTimeScale(speed);
      speedDisplay.textContent = speed.toFixed(1) + 'x';
    };

    ghostToggleBtn.onclick = () => {
      ghostEnabled = !ghostEnabled;
      ghostToggleBtn.textContent = ghostEnabled ? 'Ghost On' : 'Ghost Off';
      ghostToggleBtn.style.background = ghostEnabled ? '#009688' : '#455a64';
      if (!ghostEnabled) {
        lastGhostRenderKey = '';
        clearGhostLines();
      } else {
        renderGhosts(currentFrame());
      }
    };

    ghostSecondsInput.oninput = () => {
      renderGhosts(currentFrame());
    };

    ghostCountInput.oninput = () => {
      renderGhosts(currentFrame());
    };

    window.updateTimeDisplay = () => {
      if (!action) {
        return;
      }
      const frame = currentFrame();
      if (document.activeElement !== timeSlider) {
        timeSlider.value = frame;
      }
      timeDisplay.textContent = `${frame} / ${totalFrames} frames (${frameRate}fps)`;
    };
  };

  const clock = new THREE.Clock();
  
  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
  
  function animate() {
    requestAnimationFrame(animate);
    if (mixer) {
      mixer.update(clock.getDelta());
      updateFrameCacheAndGhosts();
      // タイムディスプレイを更新
      if (window.updateTimeDisplay) {
        window.updateTimeDisplay();
      }
    }
    controls.update(); // dampingが有効な場合に必要
    renderer.render(scene, camera);
  }
  
  animate();

} catch (error) {
  console.error("初期化エラー:", error);
  showError(`初期化に失敗しました: ${error.message}`);
}
</script>
</body>
</html>
