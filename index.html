<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>FBX Camera Motion Capture</title>
  <style>
    body {margin:0; overflow:hidden;}
    * {
      box-sizing: border-box;
    }
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
      pointer-events: none;
      display: none;
      z-index: 9999;
    }
    #crosshair::before,
    #crosshair::after {
      content: '';
      position: absolute;
      background: white;
    }
    #crosshair::before {
      left: 50%;
      top: 0;
      width: 2px;
      height: 100%;
      transform: translateX(-50%);
    }
    #crosshair::after {
      top: 50%;
      left: 0;
      height: 2px;
      width: 100%;
      transform: translateY(-50%);
    }
    #recordingFrame {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      border: 4px solid red;
      pointer-events: none;
      display: none;
      z-index: 10000;
      animation: recordingPulse 1s ease-in-out infinite alternate;
    }
    @keyframes recordingPulse {
      from { border-color: red; }
      to { border-color: rgba(255, 0, 0, 0.5); }
    }
  </style>
</head>
<body>
<div id="loading" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-family: Arial, sans-serif; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 10px;">
  FBXファイルを読み込み中...
</div>
<div id="info" style="position: absolute; top: 10px; left: 10px; color: white; font-family: monospace; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 5px; font-size: 12px; max-width: 300px; pointer-events: none; z-index: 1000;">
  v1.2.0 - 初期化中...
  <div id="recordStatus" style="margin-top: 5px;">待機中</div>
  <div id="recordTime" style="margin-top: 2px;">0.0s</div>
</div>

<!-- ショートカットガイド -->
<div id="shortcutGuide" style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 12px; border-radius: 8px; color: white; font-family: Arial, sans-serif; width: 200px; pointer-events: none; z-index: 1000;">
  <div style="margin-bottom: 8px; font-size: 12px; font-weight: bold; text-align: center;">⌨️ ショートカット</div>
  <div style="font-size: 10px; line-height: 1.4; color: #ddd;">
    <div><span style="color: #4CAF50;">[P]</span> 再生/停止</div>
    <div><span style="color: #f44336;">[O]</span> キャプチャ/停止</div>
    <div><span style="color: #2196F3;">[I]</span> カメラ再生/停止</div>
    <div><span style="color: #ff9800;">[U]</span> glTF出力</div>
    <div><span style="color: #9C27B0;">[K]</span> 軸切り替え</div>
    <div><span style="color: #00BCD4;">[L]</span> FBX読み込み</div>
    <div style="margin-top: 8px; border-top: 1px solid #555; padding-top: 6px;">
      <div>WASD移動 | ホイール上下</div>
      <div>[Esc] ポインター解除</div>
    </div>
  </div>
</div>

<input type="file" id="fbxFileInput" accept=".fbx" style="display: none;">
<input type="checkbox" id="convertToYUp" checked style="display: none;">

<!-- 再生ポイントスライダー -->
<div id="timeSliderContainer" style="position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); padding: 8px 20px; border-radius: 8px; color: white; font-family: Arial, sans-serif; display: none; width: 500px; pointer-events: auto; z-index: 1000;">
  <div style="display: flex; align-items: center; gap: 10px;">
    <span style="font-size: 10px; min-width: 30px;">時間:</span>
    <input type="range" id="timeSlider" min="0" max="100" value="0" style="flex: 1; height: 4px;">
    <span id="timeDisplay" style="font-size: 10px; min-width: 60px; text-align: right;">0.0 / 0.0s</span>
  </div>
</div>

<div id="crosshair"></div>
<div id="recordingFrame"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
  }
}
</script>

<script type="module">
// Three.jsをグローバルに設定してからアプリを開始
import * as THREE from 'three';
window.THREE = THREE;

// アプリケーションを動的インポートして開始
import('./js/app.js');
</script>
</body>
</html>
